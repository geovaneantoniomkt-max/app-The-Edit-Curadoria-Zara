<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>The Edit · Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">THE EDIT</span>
      <span class="brand-sub">Dashboard de performance</span>
    </div>
    <div class="top-actions">
      <span class="account-chip" id="account-chip"></span>
      <button type="button" class="btn btn-ghost btn-icon" id="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <form method="post" action="/logout"><button type="submit" class="btn btn-ghost">Sair</button></form>
    </div>
  </header>

  <div class="filters" role="toolbar" aria-label="Filtros">
    <label class="field">
      <span>Período</span>
      <select id="preset"></select>
    </label>
    <label class="field">
      <span>De</span>
      <input type="date" id="since">
    </label>
    <label class="field">
      <span>Até</span>
      <input type="date" id="until">
    </label>
    <button type="button" class="btn" id="refresh">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Atualizar
    </button>
    <span class="updated" id="updated" aria-live="polite"></span>
  </div>

  <nav class="tabs" role="tablist" aria-label="Seções">
    <button type="button" role="tab" data-tab="overview" id="tabbtn-overview" aria-controls="tab-overview">Visão geral</button>
    <button type="button" role="tab" data-tab="campaigns" id="tabbtn-campaigns" aria-controls="tab-campaigns">Campanhas</button>
    <button type="button" role="tab" data-tab="creatives" id="tabbtn-creatives" aria-controls="tab-creatives">Criativos</button>
    <button type="button" role="tab" data-tab="app" id="tabbtn-app" aria-controls="tab-app">App</button>
    <button type="button" role="tab" data-tab="audience" id="tabbtn-audience" aria-controls="tab-audience">Público</button>
  </nav>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main id="main">
    <section class="tab-panel" id="tab-overview" role="tabpanel" aria-labelledby="tabbtn-overview">
      <p class="empty">Carregando dados da Meta…</p>
    </section>
    <section class="tab-panel" id="tab-campaigns" role="tabpanel" aria-labelledby="tabbtn-campaigns" hidden></section>
    <section class="tab-panel" id="tab-creatives" role="tabpanel" aria-labelledby="tabbtn-creatives" hidden></section>
    <section class="tab-panel" id="tab-app" role="tabpanel" aria-labelledby="tabbtn-app" hidden></section>
    <section class="tab-panel" id="tab-audience" role="tabpanel" aria-labelledby="tabbtn-audience" hidden></section>
  </main>

  <footer class="footer">
    <span>Fonte: Meta Marketing API · atribuição conforme configuração de cada conjunto de anúncios.</span>
  </footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>

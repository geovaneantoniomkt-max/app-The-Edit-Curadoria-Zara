<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>The Edit · Entrar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="wordmark">THE EDIT</p>
    <h1>Dashboard de performance</h1>
    <p class="muted">Campanhas Meta Ads e app. Acesso restrito à equipe.</p>
    <form method="post" action="/login" class="login-form">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="login-error" id="login-error" role="alert" hidden>Senha incorreta. Tente novamente.</p>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>

name: Deploy do dashboard (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe
        run: npm run check

      - name: Conferir secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN META_ACCESS_TOKEN DASHBOARD_PASSWORD SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::O secret $name não está configurado no repositório (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Descobrir a conta da Cloudflare
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ]; then
            echo "account_id=$CF_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          resp=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
            echo "::error::Não foi possível listar as contas da Cloudflare com o CLOUDFLARE_API_TOKEN: $(echo "$resp" | jq -c '.errors')"
            exit 1
          fi
          count=$(echo "$resp" | jq '.result | length')
          if [ "$count" = "1" ]; then
            echo "account_id=$(echo "$resp" | jq -r '.result[0].id')" >> "$GITHUB_OUTPUT"
            echo "Conta Cloudflare: $(echo "$resp" | jq -r '.result[0].name')"
          elif [ "$count" = "0" ]; then
            echo "::error::O token não tem acesso a nenhuma conta. Crie o token a partir do modelo 'Edit Cloudflare Workers'."
            exit 1
          else
            echo "::error::O token acessa $count contas. Crie o secret CLOUDFLARE_ACCOUNT_ID com o ID da conta onde o dashboard deve rodar."
            echo "$resp" | jq -r '.result[] | "- \(.name): \(.id)"'
            exit 1
          fi

      - name: Publicar o Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Enviar secrets para o Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          umask 077
          file="$RUNNER_TEMP/worker-secrets.json"
          jq -n \
            --arg meta "$META_ACCESS_TOKEN" \
            --arg pass "$DASHBOARD_PASSWORD" \
            --arg sess "$SESSION_SECRET" \
            --arg app "$META_APP_SECRET" \
            '{META_ACCESS_TOKEN: $meta, DASHBOARD_PASSWORD: $pass, SESSION_SECRET: $sess} + (if $app != "" then {META_APP_SECRET: $app} else {} end)' > "$file"
          npx wrangler secret bulk "$file"
          rm -f "$file"

      - name: Testar se o dashboard responde
        if: steps.deploy.outputs.url != ''
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/healthz" || true)
            if [ "$code" = "200" ]; then echo "OK"; exit 0; fi
            sleep 5
          done
          echo "::warning::O endpoint /healthz ainda não respondeu 200 (pode levar alguns segundos para propagar)."

      - name: Resumo
        run: |
          {
            echo "## Dashboard The Edit publicado"
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              echo ""
              echo "Acesse: ${{ steps.deploy.outputs.url }}"
            fi
            echo ""
            echo "Entre com a senha definida no secret DASHBOARD_PASSWORD."
          } >> "$GITHUB_STEP_SUMMARY"

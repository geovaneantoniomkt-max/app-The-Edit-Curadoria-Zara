name: Sonda da API do Meta (temporária)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar (como no deploy)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ADS_TOKEN || secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v23.0
          OUT_DIR: public/data
        run: python scripts/fetch_meta.py
      - name: Resumo criptografado dos seguidores (nada em texto claro)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ADS_TOKEN || secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v23.0
        run: python probe/audit_follows.py

name: Sonda da API do Meta (temporária)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sondar campos e ações (só nomes e proporções)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ADS_TOKEN || secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v23.0' }}
        run: python scripts/probe_meta.py
